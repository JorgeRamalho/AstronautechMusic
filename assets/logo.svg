<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Astronautech">
  <defs>
    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#ff77ff"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff77ff"/>
    </linearGradient>
    <linearGradient id="hp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff77ff" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#030008"/>

  <!-- Stars -->
  <circle cx="60" cy="50" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="140" cy="90" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="220" cy="40" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="310" cy="70" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="400" cy="55" r="1.1" fill="#fff" opacity="0.7"/>
  <circle cx="460" cy="100" r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="90" cy="130" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="430" cy="140" r="1" fill="#fff" opacity="0.8"/>

  <!-- Grid floor -->
  <path d="M0 380 L512 380 L512 512 L0 512 Z" fill="url(#grid)" opacity="0.5" transform="skewY(-8)"/>

  <!-- Wireframe mountains -->
  <polygon points="0,380 80,280 160,330 240,220 320,290 400,240 480,300 512,340 512,380" fill="none" stroke="url(#wire)" stroke-width="1.5" opacity="0.8"/>
  <polyline points="80,280 160,330 240,220" fill="none" stroke="url(#wire)" stroke-width="1" opacity="0.5"/>
  <polyline points="320,290 400,240 480,300" fill="none" stroke="url(#wire)" stroke-width="1" opacity="0.5"/>

  <!-- Diamond -->
  <polygon points="256,120 380,256 256,392 132,256" fill="none" stroke="url(#diamond)" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="256,140 360,256 256,372 152,256" fill="none" stroke="url(#diamond)" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.7"/>

  <!-- Logo text -->
  <text x="256" y="268" text-anchor="middle" font-family="'Dancing Script', cursive" font-size="52" font-weight="700" fill="#ffffff" filter="url(#glow)">astronautech</text>

  <!-- Headphones -->
  <g transform="translate(190, 430)">
    <path d="M16 20a24 24 0 0 1 48 0v10a8 8 0 0 1-8 8h-3V22a16 16 0 0 0-32 0v16h-3a8 8 0 0 1-8-8V20z" fill="url(#hp)"/>
    <rect x="8" y="20" width="10" height="18" rx="5" fill="url(#hp)"/>
    <rect x="62" y="20" width="10" height="18" rx="5" fill="url(#hp)"/>
  </g>

  <text x="280" y="448" font-family="'Dancing Script', cursive" font-size="22" fill="#ffffff" filter="url(#glow)">@astronautech</text>
</svg>
